<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ece7de" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
  <title>Auf der Zunge</title>
  <script>
    // Language before anything is shown: stored choice, otherwise the browser's first language (de* -> de, else en).
    // src/main.ts reads the result from <html lang>.
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('adz.lang'); } catch (e) { /* no storage */ }
      if (lang !== 'de' && lang !== 'en') {
        var first = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        lang = first.toLowerCase().indexOf('de') === 0 ? 'de' : 'en';
      }
      document.documentElement.lang = lang;
      document.title = lang === 'de' ? 'Auf der Zunge' : 'Tip of the Tongue';
    })();
  </script>
</head>
<body>
  <main id="app" class="app"></main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
